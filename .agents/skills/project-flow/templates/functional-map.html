<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Mapa funcional</title>
<style>
  :root { --accent: #1988CC; --ink: #192e3b; --link: #125a86; --rail: #f1f7fb; --node: #e4f2fa;
    font: 11.5pt/1.48 Arial, sans-serif; color: var(--ink); }
  body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h1, h2 { font: normal 25pt/1.15 Georgia, serif; }
  h1 { font-size: 30pt; }
  h2 { margin: .35em 0; }
  h3 { margin: 1.1em 0 .45em; font-size: 13pt; color: var(--link); }
  #guide > h1, article { border-top: 4pt solid var(--accent); padding-top: 12pt; }
  p { margin: .5em 0 1em; }
  a, .label { color: var(--link); }
  .label { font-weight: 650; }
  article { break-before: page; margin-top: 2rem; }
  table { table-layout: fixed; width: 100%; border-collapse: collapse; margin-bottom: 1em; }
  th, td { overflow-wrap: anywhere; }
  .lanes { background: var(--rail); }
  .lanes th, .lanes td { border-inline: 2px solid white; text-align: center; }
  .lanes th { padding: .8em .45em; border-top: 2px solid var(--accent); color: var(--link); }
  .lanes td { padding: 0 .7em; vertical-align: middle; }
  .lanes tbody:last-child td { padding-bottom: .9em; }
  .action, .state { background: var(--node); border: 1px solid #77aeca; color: var(--ink);
    border-radius: .5em; padding: .75em; text-align: center; overflow-wrap: anywhere; }
  .action { align-content: center; min-height: 3.65em; box-sizing: border-box; font-weight: 600; }
  .lanes .connector td { padding: 0; }
  .connector svg { width: 100%; height: 1.65em; display: block; overflow: visible; color: var(--accent); }
  .arrive { position: relative; }
  .arrive::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border: 4px solid transparent; border-top: 7px solid var(--accent); border-bottom: 0; }
  .state-row { display: grid; grid-template-columns: 1fr 1.3fr 1fr; align-items: center; margin: .8em 0; break-inside: avoid; }
  .state { min-width: 0; font-weight: bold; align-content: center; align-self: stretch; }
  .transition { text-align: center; }
  .event { display: block; margin: .45em 0; padding: 0 .55em .35em; border-bottom: 2px solid var(--accent);
    position: relative; overflow-wrap: anywhere; }
  .event::after { content: ''; position: absolute; right: 0; bottom: -5px; border: 4px solid transparent;
    border-left: 7px solid var(--accent); border-right: 0; }
  .reverse::after { right: auto; left: 0; transform: rotate(180deg); }
  .diagram-intro { break-after: avoid; }
  .flow-notes { break-inside: avoid; }
  .back { display: block; margin-top: 1.3em; font-size: 10pt; }
  .measure-journey { width: 728pt; }
  .measure-journey .editorial, .measure-journey .local-source { display: none; }
  .journey-index li { break-inside: avoid; margin-bottom: .45em; }
  .long-index { columns: 2; column-gap: 2.3em; }
  @media screen and (max-width: 42rem) { .long-index { columns: 1; } }
  tbody, tr, .action { break-inside: avoid; }
  h2, h3, thead, .label { break-after: avoid; }
  .comparison h1 { margin-bottom: .2em; }
  .comparison h2 { font-size: 17pt; }
  .comparison nav { display: flex; gap: 1.5em; margin: 1em 0; }
  .comparison section > p:first-of-type { break-after: avoid; }
  .comparison section + section { break-before: page; }
  .compact .versions { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .compact .versions section { min-width: 0; break-before: auto; }
  .compact .cross-link { display: none; }
  .example { border-inline-start: 3px solid var(--accent); padding-left: .8em; break-inside: avoid; }
  .measure { width: 178mm; max-width: none; }
  .map-proposal { break-before: page; }
  .compact .map-proposal { break-before: auto; }
  .notice { border-inline-start: 3px solid var(--accent); padding-inline-start: .8em; }
  .origin { break-inside: avoid; }
  @media screen and (max-width: 42rem) { .compact .versions { grid-template-columns: 1fr; } }
  @page { size: A4; margin: 16mm; }
  @page journey { size: 800pt 900pt; margin: 28pt 36pt; }
  @media print {
    .local-source, .editorial { display: none !important; }
    body { margin: 0; max-width: none; padding: 0; }
    article { margin: 0; }
    article[id^="flow-"] { page: journey; }
    * { print-color-adjust: exact; }
  }
</style>
<main id="guide"></main>
<!-- Edite o conteúdo deste bloco. Represente < dentro dos textos como \u003c. -->
<script type="application/json" id="map-data">
{"product":"","overview":"","journeys":[]}
</script>
<script>
  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function required(value) {
    if (typeof value !== 'string' || !value.trim()) throw Error('Há um texto obrigatório vazio.');
    return value;
  }

  function connector(group, actors, from, to) {
    const ns = 'http://www.w3.org/2000/svg';
    const row = group.insertRow();
    row.className = 'connector';
    row.setAttribute('aria-hidden', 'true');
    actors.forEach((_, i) => {
      const cell = row.insertCell();
      if (i < Math.min(from, to) || i > Math.max(from, to)) return;
      const svg = document.createElementNS(ns, 'svg');
      function line(x1, y1, x2, y2) {
        const segment = document.createElementNS(ns, 'line');
        for (const [name, value] of Object.entries({x1, y1, x2, y2})) segment.setAttribute(name, value + '%');
        segment.setAttribute('stroke', 'currentColor');
        segment.setAttribute('stroke-width', '1.5');
        svg.append(segment);
      }
      if (i === from) line(50, 0, 50, 50);
      if (from !== to) line(i === Math.min(from, to) ? 50 : 0, 50, i === Math.max(from, to) ? 50 : 100, 50);
      if (i === to) {
        line(50, 50, 50, 100);
        cell.className = 'arrive';
      }
      cell.append(svg);
    });
  }

  function lanes(steps, offset, actors) {
    const table = element('table', undefined, 'lanes');
    const header = table.createTHead().insertRow();
    actors.forEach(actor => header.append(element('th', actor)));
    steps.forEach((step, i) => {
      const group = table.createTBody();
      const row = group.insertRow();
      const owner = actors.indexOf(step.actor);
      actors.forEach((actor, j) => {
        const cell = row.insertCell();
        if (j === owner) {
          const action = element('div', (offset + i + 1) + '. ' + required(step.action), 'action');
          if (step.label) action.prepend(element('strong', required(step.label) + ' · '));
          cell.append(action);
        }
      });
      if (i + 1 < steps.length) {
        connector(group, actors, owner, actors.indexOf(steps[i + 1].actor));
      }
    });
    return table;
  }

  function drawFlow(page, journey, sharedActors) {
    // Split at a handoff before a fifth participant would make the page unreadable.
    let start = 0;
    if (journey.steps?.length) page.append(element('h3', 'Quem faz o quê'));
    while (start < (journey.steps?.length ?? 0)) {
      const participants = new Set();
      let end = start;
      while (end < journey.steps.length) {
        const actor = required(journey.steps[end].actor);
        if (participants.size === 4 && !participants.has(actor)) break;
        participants.add(actor);
        end++;
      }
      page.append(lanes(journey.steps.slice(start, end), start, sharedActors || [...participants]));
      start = end;
    }
  }

  function flowNotes(page, journey, withExample = false) {
    const notes = element('div', undefined, 'flow-notes');
    if (journey.states) {
      notes.append(element('h3', 'Quando a situação muda'), element('p', required(journey.states.intro), 'diagram-intro'));
      const changes = journey.states.transitions;
      if (!changes.length) throw Error('Informe as transições do diagrama de estados.');
      for (let i = 0; i < changes.length; i++) {
        const change = changes[i];
        const row = element('div', undefined, 'state-row');
        const events = element('div', undefined, 'transition');
        events.append(element('span', required(change.event), 'event'));
        const next = changes[i + 1];
        if (change.from !== change.to && next && next.from === change.to && next.to === change.from) {
          events.append(element('span', required(next.event), 'event reverse'));
          i++;
        }
        row.append(element('div', required(change.from), 'state'), events, element('div', required(change.to), 'state'));
        notes.append(row);
      }
    }
    for (const [key, title] of [['alternatives', 'Outros caminhos'], ['failures', 'Quando algo dá errado']]) {
      if (!journey[key]?.length) continue;
      const list = element('ul');
      journey[key].forEach(item => list.append(element('li', required(item))));
      notes.append(element('h3', title), list);
    }
    if (withExample) notes.append(element('h3', 'Na prática'), element('p', required(journey.example)));
    if (notes.childElementCount) page.append(notes);
  }

  function identifier(value) {
    if (!/^[a-z][a-z0-9-]*$/.test(required(value))) throw Error('Identificador inválido.');
    return value;
  }

  function chapter(journey, origins, journeys) {
    const page = element('article');
    page.id = 'flow-' + identifier(journey.id);
    if (journey.status && !['Em uso', 'Previsto', 'A confirmar'].includes(journey.status)) throw Error('Situação da jornada inválida.');
    page.append(element('h2', required(journey.title)));
    for (const id of journey.related || []) {
      if (!journeys.has(id)) throw Error('Jornada relacionada ausente.');
      page.append(linkTo('flow-' + id, 'Ver também · ' + journeys.get(id)), element('br'));
    }
    const versions = element('div', undefined, 'versions');
    const base = element('section');
    if (journey.status) base.append(element('p', journey.status, 'label'));
    base.append(element('p', required(journey.intro)));
    const proposals = journey.proposals ?? [];
    if (proposals.length && !journey.status) throw Error('Informe a situação da jornada afetada.');
    if (journey.steps?.length || journey.states) {
      drawFlow(base, journey);
      flowNotes(base, journey, true);
    } else if (journey.status !== 'Previsto' || !proposals.length) {
      throw Error('A jornada precisa de passos ou transições.');
    }
    versions.append(base);
    const seen = new Set();
    for (const proposal of proposals) {
      const origin = origins.get(proposal.origin);
      if (!origin || seen.has(origin.item)) throw Error('Origem ausente ou repetida na mesma jornada.');
      seen.add(required(origin.item));
      const version = element('section', undefined, 'map-proposal');
      version.id = 'proposal-' + journey.id + '.' + identifier(proposal.origin);
      version.append(element('p', 'Mudança proposta · ' + journey.title, 'label'), element('h3', required(origin.title)),
        linkTo('origin-' + proposal.origin, 'Abrir requisito · ' + required(origin.revision)),
        element('p', required(proposal.intro)));
      if (!proposal.steps?.length && !proposal.states) throw Error('Descreva os passos ou estados da proposta.');
      drawFlow(version, proposal);
      flowNotes(version, proposal, true);
      version.append(linkTo(page.id, 'Voltar ao início da jornada'));
      base.append(linkTo(version.id, 'Ver mudança · ' + origin.title), element('br'));
      versions.append(version);
    }
    for (const conflict of journey.conflicts || []) {
      const notice = element('aside', undefined, 'notice');
      notice.append(element('h3', 'A decidir'), element('p', required(conflict.reason)));
      if (!conflict.origins?.length) throw Error('Identifique os requisitos envolvidos.');
      for (const key of conflict.origins) {
        if (!origins.has(key)) throw Error('Requisito do aviso ausente.');
        notice.append(linkTo('origin-' + key, origins.get(key).title), element('br'));
      }
      base.append(notice);
    }
    page.append(versions);
    const evidence = typeof journey.evidence === 'string' ? journey.evidence.trim() : '';
    const sources = Array.isArray(journey.sources) ? journey.sources.filter(source => typeof source === 'string' && source.trim()) : [];
    if (evidence || sources.length) {
      const notes = element('details', undefined, 'editorial');
      notes.append(element('summary', 'Fontes da jornada'));
      if (evidence) notes.append(element('p', evidence));
      if (sources.length) {
        const list = element('ul');
        sources.forEach(source => list.append(element('li', source)));
        notes.append(list);
      }
      page.append(notes);
    }
    const back = linkTo('map-index', 'Voltar ao índice');
    back.className = 'back';
    page.append(back);
    return page;
  }

  function linkTo(id, text) {
    const link = element('a', text);
    link.href = '#' + id;
    return link;
  }

  function remoteLink(url, text) {
    const remote = new URL(required(url));
    if (!['https:', 'http:'].includes(remote.protocol) || remote.username || remote.password) throw Error('Link remoto inválido.');
    const link = element('a', text);
    link.href = remote.href;
    return link;
  }

  function comparison(data) {
    const doc = element('div', undefined, 'comparison');
    doc.append(element('h1', required(data.title)));
    if (data.revision) doc.append(element('p', required(data.revision), 'label'));
    doc.append(element('p', required(data.intro)),
      element('h2', 'O que muda'), element('p', required(data.change)));
    const nav = element('nav');
    const beforeLink = linkTo('before', 'Ver fluxo anterior');
    const afterLink = linkTo('after', 'Ver fluxo proposto');
    nav.append(beforeLink, afterLink);
    const versions = element('div', undefined, 'versions');
    const actors = [...new Set([...(data.before.steps ?? []), ...(data.after.steps ?? [])].map(step => required(step.actor)))];
    for (const [id, title, other] of [['before', 'Como funciona hoje', afterLink], ['after', 'Como vai funcionar', beforeLink]]) {
      const flow = data[id];
      const section = element('section');
      section.id = id;
      section.append(element('h2', title), element('p', required(flow.intro)));
      if (id === 'before') required(flow.source);
      if (flow.steps !== undefined && !Array.isArray(flow.steps)) throw Error('Confira os passos da jornada.');
      if (id === 'after' && !flow.steps?.length && !flow.states) throw Error('Descreva o fluxo proposto.');
      drawFlow(section, flow, actors.length <= 4 ? actors : undefined);
      flowNotes(section, flow);
      const crossLink = element('p', undefined, 'cross-link');
      crossLink.append(other.cloneNode(true));
      section.append(crossLink);
      versions.append(section);
    }
    const example = element('div', undefined, 'example');
    example.append(element('h3', 'Na prática'), element('p', required(data.example)));
    doc.append(nav, versions, example);
    if (data.parentDocuments !== undefined) {
      required(data.revision);
      const flow = remoteLink(data.parentDocuments.comparison, 'Abrir o fluxo completo da mudança');
      const map = remoteLink(data.parentDocuments.map, 'Abrir o mapa do projeto');
      if (flow.href === map.href) throw Error('Confira os dois anexos do requisito.');
      const links = element('p');
      links.append(flow, ' · ', map);
      doc.append(links);
    }
    document.title = data.title;
    return doc;
  }

  function fitComparison(doc) {
    if (doc.querySelector('.transition') || [...doc.querySelectorAll('thead tr')].some(row => row.cells.length > 2)) return;
    doc.classList.add('compact', 'measure');
    // Measure at A4 print width. Leave room for differences in the printer's font metrics.
    if (doc.getBoundingClientRect().height > 245 * 96 / 25.4 || doc.scrollWidth > doc.clientWidth) {
      doc.classList.remove('compact');
    }
    doc.classList.remove('measure');
  }

  function sizeJourneySheets(guide) {
    const style = document.createElement('style');
    document.head.append(style);
    // Match the printed content width. Short journeys end naturally; long ones paginate normally.
    for (const page of guide.querySelectorAll('article[id^="flow-"]')) {
      if (page.querySelector('.map-proposal')) continue;
      page.classList.add('measure-journey');
      const height = Math.ceil(page.getBoundingClientRect().height * 72 / 96) + 68;
      page.classList.remove('measure-journey');
      if (height > 1080) continue;
      const name = 'sheet-' + page.id;
      style.sheet.insertRule('@page ' + name + ' { size: 800pt ' + Math.max(480, height) + 'pt; margin: 28pt 36pt; }');
      page.style.page = name;
    }
  }

  function productMap(map) {
    const doc = document.createDocumentFragment();
    const index = element('ol');
    index.className = map.journeys.length > 14 ? 'journey-index long-index' : 'journey-index';
    doc.append(element('h1', required(map.product)), element('p', required(map.overview)));
    if (map.edition) doc.append(element('p', 'Edição ' + required(map.edition), 'label'));
    const heading = element('h2', 'Índice de jornadas');
    heading.id = 'map-index';
    doc.append(heading, index);
    if (!map.journeys.length) throw Error('Preencha ao menos uma jornada.');
    const journeys = new Map(map.journeys.map(journey => [identifier(journey.id), required(journey.title)]));
    if (journeys.size !== map.journeys.length) throw Error('Há capítulos com o mesmo identificador.');
    const origins = new Map(Object.entries(map.requirements ?? {}));
    for (const journey of map.journeys) {
      const page = chapter(journey, origins, journeys);
      const link = element('a', journey.title);
      link.setAttribute('href', '#' + page.id);
      const entry = element('li');
      entry.append(link);
      const count = journey.proposals?.length ?? 0;
      if (count) entry.append(' · ' + count + (count === 1 ? ' mudança proposta' : ' mudanças propostas'));
      if (journey.conflicts?.length) entry.append(' · A decidir');
      index.append(entry);
      doc.append(page);
    }
    if (origins.size) {
      const references = element('article');
      references.id = 'requirements';
      references.append(element('h2', 'Requisitos das mudanças'));
      const entry = element('li');
      entry.append(linkTo(references.id, 'Requisitos das mudanças'));
      index.append(entry);
      for (const [id, origin] of origins) {
        const source = element('section', undefined, 'origin');
        source.id = 'origin-' + identifier(id);
        source.append(element('h3', required(origin.title)), element('p', required(origin.revision) + ' · ' + required(origin.item)));
        const path = required(origin.path);
        if (new URL(path, 'https://local.invalid/').origin !== 'https://local.invalid'
            || /^[a-z][a-z0-9+.-]*:/i.test(path) || path.startsWith('/') || path.includes('\\')
            || path !== path.trim() || /[\r\n\t]/.test(path)) throw Error('Use um caminho relativo para o requisito.');
        const local = element('a', 'Abrir requisito local', 'local-source');
        local.setAttribute('href', path);
        source.append(local);
        if (origin.url) {
          source.append(element('p'), remoteLink(origin.url, 'Abrir tarefa · ' + origin.title));
        }
        references.append(source);
      }
      doc.append(references);
    }
    document.title = map.product + ' — Mapa funcional';
    return doc;
  }

  try {
    const data = JSON.parse(document.getElementById('map-data').textContent);
    const guide = document.getElementById('guide');
    if (data.kind === 'comparison') {
      const doc = comparison(data);
      guide.append(doc);
      fitComparison(doc);
    } else {
      guide.append(productMap(data));
      for (const page of guide.querySelectorAll('article')) {
        if (page.querySelectorAll('.map-proposal').length === 1 && !page.querySelector('.notice')) fitComparison(page);
      }
      sizeJourneySheets(guide);
    }
  } catch (error) {
    // A link in a custom footer must not turn an error page into a valid PDF.
    document.addEventListener('DOMContentLoaded', () => {
      document.body.replaceChildren(element('p', 'Mapa incompleto. ' + error.message));
    }, {once: true});
  }
</script>
</html>
